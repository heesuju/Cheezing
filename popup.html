<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cheezing</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">

    <!-- Top App Header -->
    <header class="app-header">
      <div class="app-header-title">
        <span id="headerTitleMain" class="header-title-content">
          <img src="icons/icon_32.png" width="17" height="17" alt="" class="app-icon">
          <span data-i18n="appTitle">Cheezing</span>
        </span>
        <span id="headerTitleSettings" class="header-title-content" style="display: none;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          <span data-i18n="settingsTitle">Settings</span>
        </span>
      </div>
      <button id="btnOpenSettings" class="header-icon-btn" title="Settings" data-i18n-title="settingsTitle" aria-label="Settings">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
      <button id="btnBackToMain" class="header-icon-btn" title="Back" data-i18n-title="backBtn" aria-label="Back" style="display: none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
    </header>

    <!-- Main View Page -->
    <div id="mainView" class="view-page active">
      <div class="scroll-area">
        <div id="status" class="status hidden"></div>

        <!-- Capture Area -->
        <div class="input-group">
          <label><span data-i18n="areaLabel">Capture Area</span>: <strong id="areaStatus">Full Page</strong></label>
          <div class="area-btn-group" id="areaRatioGroup">
            <button class="area-btn active" data-ratio="full" title="Full Page" data-i18n-title="fullPage">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="1"/>
                <line x1="3" y1="8" x2="21" y2="8"/>
              </svg>
              <span data-i18n="areaRatioFull">Full</span>
            </button>
            <button class="area-btn" data-ratio="1" title="1:1 Square">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="4" y="4" width="16" height="16" rx="1"/>
              </svg>
              <span>1:1</span>
            </button>
            <button class="area-btn" data-ratio="1.7777" title="16:9 Widescreen">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="6" width="20" height="12" rx="1"/>
              </svg>
              <span>16:9</span>
            </button>
            <button class="area-btn" data-ratio="1.3333" title="4:3 Standard">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="5" width="20" height="14" rx="1"/>
              </svg>
              <span>4:3</span>
            </button>
            <button class="area-btn" data-ratio="free" title="Free Form" data-i18n-title="areaRatioFree">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 3h4v4H3zM17 3h4v4h-4zM3 17h4v4H3zM17 17h4v4h-4z"/>
                <line x1="7" y1="5" x2="17" y2="5" stroke-dasharray="2 2"/>
                <line x1="7" y1="19" x2="17" y2="19" stroke-dasharray="2 2"/>
                <line x1="5" y1="7" x2="5" y2="17" stroke-dasharray="2 2"/>
                <line x1="19" y1="7" x2="19" y2="17" stroke-dasharray="2 2"/>
              </svg>
              <span data-i18n="areaRatioFree">Free</span>
            </button>
          </div>
        </div>

        <div class="divider"></div>

        <!-- Capture Mode -->
        <div class="input-group">
          <label><span data-i18n="captureModeLabel">Capture Mode</span>: <strong id="modeStatus">Screen</strong></label>
          <!-- Long and Hi-Res toggle independently; neither = the visible screen -->
          <div class="area-btn-group" id="captureModeGroup">
            <button class="area-btn" data-toggle="longCapture" title="Scroll to the end and capture the whole page as one long image" data-i18n-title="modeScrollTip">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="6" y="2" width="12" height="20" rx="1"/>
                <line x1="12" y1="7" x2="12" y2="16"/>
                <polyline points="9 13 12 16 15 13"/>
              </svg>
              <span data-i18n="modeScroll">Long</span>
            </button>
            <button class="area-btn" data-toggle="hiRes" title="Capture at higher resolution (multiplier in Settings)" data-i18n-title="modeZoomTip">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="5" width="20" height="14" rx="2"/>
                <path d="M6 9v6M6 12h4M10 9v6"/>
                <path d="M13.5 9v6h2a3 3 0 0 0 0-6z"/>
              </svg>
              <span data-i18n="modeZoom">Hi-Res</span>
            </button>
          </div>
        </div>

        <div class="divider"></div>

        <!-- Filename Prefix -->
        <div class="input-group">
          <label data-i18n="prefixLabel">Filename Prefix</label>
          <input type="text" id="prefixInput" placeholder="e.g., my_capture" data-i18n-placeholder="prefixPlaceholder" />
        </div>

        <div class="divider"></div>

        <div class="macro-toggle-row" id="macroToggleRow">
          <div class="macro-toggle-left">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"/>
              <path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
            </svg>
            <span class="macro-toggle-label" data-i18n="macroLabel">Macro</span>
            <span class="macro-badge" id="macroBadge" style="display:none;"></span>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" id="macroEnabledToggle">
            <span class="toggle-slider"></span>
          </label>
        </div>

        <!-- Macro Panel (expands when toggle is on) -->
        <div class="macro-panel" id="macroPanel">
          <div class="macro-panel-inner">

            <!-- Recordings select + rename + delete -->
            <div class="recordings-row" id="recordingsRow">
              <div class="select-wrapper">
                <select id="savedRecordingsSelect">
                  <option value="">＋ New Recording</option>
                </select>
                <svg class="select-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="6 9 12 15 18 9"/>
                </svg>
              </div>
              <button id="btnRename" class="btn secondary icon-btn" title="Rename recording" data-i18n-title="renameRecordingTitle" style="display:none;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 20h9"/>
                  <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/>
                </svg>
              </button>
              <button id="btnDelete" class="btn danger icon-btn" title="Delete recording" data-i18n-title="deleteRecordingTitle" style="display:none;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <polyline points="3 6 5 6 21 6"/>
                  <path d="M19 6l-1 14H6L5 6"/>
                  <path d="M10 11v6M14 11v6"/>
                </svg>
              </button>
            </div>

            <!-- Record section: shown when New is selected -->
            <div id="recordSection">
              <div class="macro-stat">
                <span data-i18n="actionsRecorded">Actions recorded</span>
                <strong id="actionCount">0</strong>
              </div>
              <button id="btnRecord" class="btn primary record-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8"/></svg>
                <span data-i18n="recordBtn">Record</span>
              </button>
            </div>

            <!-- Save/rename row: shown after stopping a new recording, or when renaming -->
            <div id="saveSection" class="save-row" style="display:none;">
              <input type="text" id="saveNameInput" placeholder="Recording name" data-i18n-placeholder="saveNamePlaceholder">
              <button id="btnSave" class="btn success small" data-i18n="saveBtn">Save</button>
              <button id="btnCancelRename" class="btn secondary icon-btn" title="Cancel" data-i18n-title="cancelBtn" style="display:none;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18"/>
                  <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
              </button>
            </div>

          </div>
        </div>

      </div><!-- /.scroll-area -->

      <!-- Run Button -->
      <div class="main-action-container">
        <button id="btnPlay" class="btn success">
          <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <span class="btn-play-text" data-i18n="runBtn">Run</span>
        </button>
      </div>
    </div><!-- /#mainView -->

    <!-- Settings View Page -->
    <div id="settingsView" class="view-page">
      <div class="settings-content">
        <!-- Language Config -->
        <div class="setting-group">
          <label class="setting-label">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <line x1="2" y1="12" x2="22" y2="12"/>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
            </svg>
            <span data-i18n="languageLabel">Language</span>
          </label>
          <div class="segmented-control">
            <button class="segment-btn active" data-lang="en">English</button>
            <button class="segment-btn" data-lang="ko">한국어</button>
          </div>
        </div>

        <!-- Theme Config -->
        <div class="setting-group">
          <label class="setting-label">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
            <span data-i18n="themeLabel">Theme</span>
          </label>
          <div class="segmented-control">
            <button class="segment-btn active" data-theme="dark">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
              </svg>
              <span data-i18n="themeDark">Dark</span>
            </button>
            <button class="segment-btn" data-theme="light">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="5"/>
                <line x1="12" y1="1" x2="12" y2="3"/>
                <line x1="12" y1="21" x2="12" y2="23"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                <line x1="1" y1="12" x2="3" y2="12"/>
                <line x1="21" y1="12" x2="23" y2="12"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
              </svg>
              <span data-i18n="themeLight">Light</span>
            </button>
          </div>
        </div>

        <!-- Hi-Res Multiplier -->
        <div class="setting-group">
          <label class="setting-label">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="5" width="20" height="14" rx="2"/>
              <path d="M6 9v6M6 12h4M10 9v6"/>
              <path d="M13.5 9v6h2a3 3 0 0 0 0-6z"/>
            </svg>
            <span data-i18n="hiResMultiplierLabel">Hi-Res multiplier</span>
          </label>
          <div class="segmented-control" id="zoomMultiplierGroup">
            <button class="segment-btn" data-multiplier="2">2x</button>
            <button class="segment-btn" data-multiplier="3">3x</button>
            <button class="segment-btn active" data-multiplier="4">4x</button>
          </div>
        </div>

        <!-- Long Capture Step Limit -->
        <div class="setting-group toggle-row">
          <label class="setting-label" for="maxStripTilesInput">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="6" y="2" width="12" height="20" rx="2"/>
              <path d="M12 7v10M9 14l3 3 3-3"/>
            </svg>
            <span data-i18n="maxStripTilesLabel">Long capture max scroll steps (0 = no limit)</span>
          </label>
          <input type="number" id="maxStripTilesInput" class="number-input" min="0" step="100" value="2000">
        </div>

        <!-- Create PDF Option -->
        <div class="setting-group toggle-row">
          <label class="setting-label" for="createPdfCheckbox">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
              <polyline points="10 9 9 9 8 9"/>
            </svg>
            <span data-i18n="createPdfLabel">Create PDF after capture</span>
          </label>
          <label class="toggle-switch">
            <input type="checkbox" id="createPdfCheckbox" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>

        <!-- Capture First Option -->
        <div class="setting-group toggle-row">
          <label class="setting-label" for="captureFirstCheckbox">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"/>
              <path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
            </svg>
            <span data-i18n="captureFirstLabel">Capture first, then run macro</span>
          </label>
          <label class="toggle-switch">
            <input type="checkbox" id="captureFirstCheckbox" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>

        <!-- Skip Duplicates Option -->
        <div class="setting-group toggle-row">
          <label class="setting-label" for="skipDuplicatesCheckbox">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="8" y="8" width="13" height="13" rx="2"/>
              <path d="M4 16V5a1 1 0 0 1 1-1h11"/>
              <line x1="11" y1="18" x2="18" y2="11"/>
            </svg>
            <span data-i18n="skipDuplicatesLabel">Skip duplicate captures</span>
          </label>
          <label class="toggle-switch">
            <input type="checkbox" id="skipDuplicatesCheckbox" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>

        <!-- Auto-stop Option -->
        <div class="setting-group toggle-row">
          <label class="setting-label" for="autoStopCheckbox">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="9"/>
              <rect x="9" y="9" width="6" height="6" rx="1"/>
            </svg>
            <span data-i18n="autoStopLabel">Stop when the page stops changing</span>
          </label>
          <label class="toggle-switch">
            <input type="checkbox" id="autoStopCheckbox" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>

        <!-- Max Captures Option -->
        <div class="setting-group toggle-row">
          <label class="setting-label" for="maxCapturesInput">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="4" y1="9" x2="20" y2="9"/>
              <line x1="4" y1="15" x2="20" y2="15"/>
              <line x1="10" y1="3" x2="8" y2="21"/>
              <line x1="16" y1="3" x2="14" y2="21"/>
            </svg>
            <span data-i18n="maxCapturesLabel">Max captures (0 = no limit)</span>
          </label>
          <input type="number" id="maxCapturesInput" class="number-input" min="0" step="1" value="0">
        </div>

        <!-- Version Info -->
        <div class="settings-footer">
          <span id="appVersion">Cheezing v1.0.0</span>
        </div>

      </div><!-- /.settings-content -->
    </div><!-- /#settingsView -->

  </div><!-- /.container -->
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
